# MediaMTX on the Arch box. Install to /etc/mediamtx/mediamtx.yml
#
# Two things are happening here: the camera publishes over RTSP, and browsers
# read over WHEP. Everything else is off.

logLevel: info

###############################################################################
# Authentication
#
# Every publish and every read is checked against truman before a byte moves.
# Gating the website alone would leave these urls readable by anyone who ever
# saw one in a network tab.
###############################################################################

authMethod: http
authHTTPAddress: https://truman.justin06lee.dev/api/media/auth

# Nothing is exempt. In particular the metrics and pprof endpoints stay shut —
# the auth route refuses every action except publish, read and playback.
# ...except the read-only api, which is bound to loopback below and never
# leaves the box. The agent asks it whether frames are actually arriving, so
# that "live" on the website means the stream is up rather than merely that
# the camera process didn't exit.
authHTTPExclude:
  - action: api

###############################################################################
# Protocols
###############################################################################

# RTSP in, from the camera on this same machine.
#
# Not RTMP, and this is the one that costs an afternoon if you get it wrong:
# RTMP cannot carry Opus, and WebRTC cannot carry AAC. MediaMTX does not
# transcode, so publishing over RTMP gives you a stream with audio no browser
# can play. RTSP carries Opus end to end.
# Read-only, loopback only. Nothing outside the box can reach 9997.
api: yes
apiAddress: 127.0.0.1:9997

rtsp: yes
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
rtmp: no

# WHEP out, to browsers.
webrtc: yes
webrtcAddress: :8889

# WebRTC needs a UDP path back to the viewer. Forward 8189/udp on the router
# (the video does not travel through Caddy), alongside 443/tcp for the
# signalling and 80/tcp for Caddy's certificate. Do not forward 8889.
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: yes

# The public name viewers reach this box by. Without it here, MediaMTX offers
# only its 192.168.x address as an ICE candidate and every viewer connects
# and then sees nothing.
#
# Written as a real list rather than `[]` with a commented entry underneath:
# that shape cannot be uncommented into valid yaml, and mediamtx refuses to
# start on the result.
webrtcAdditionalHosts:
  - media.justin06lee.dev

# Also gather a server-reflexive candidate over STUN: a numeric public
# address, learned live, so it never goes stale when the ISP moves the IP.
# Phone browsers are patchy about resolving the hostname candidate above,
# and a viewer only needs one of the two to land.
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

# HLS is off. It is the fallback for networks that block UDP, and it costs
# ten-plus seconds of latency — turn it on deliberately if you need it, not by
# default, or chat quietly stops matching the picture.
hls: no
srt: no

###############################################################################
# The one path
###############################################################################

paths:
  live:
    # Deliberately empty. Recording is not driven from here: truman-agent
    # starts and stops the recorder alongside the camera, so an episode spans
    # one sitting rather than one uninterrupted publish. A usb blip that drops
    # the stream for two seconds would otherwise file two episodes.
    #
    # It also keeps this file free of hooks that would need to read the shared
    # key — MediaMTX does not run as root, and /etc/truman/box.env is 0600.
