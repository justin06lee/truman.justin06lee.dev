# Install to /etc/systemd/resolved.conf.d/truman-dnsmasq.conf
#
# The box serves the house's dns via dnsmasq (hardcoded 1.1.1.1/8.8.8.8
# upstreams) but its OWN lookups were going through the AT&T gateway over
# wifi — and every wifi roam or gateway hiccup surfaced as an EAI_AGAIN
# burst that took the site's database calls down with it (measured: 153
# failures on the worst day). Route the box through its own resolver, with
# a direct upstream as failover so a dead dnsmasq can't take dns with it.
[Resolve]
DNS=127.0.0.1 1.1.1.1
Domains=~.
