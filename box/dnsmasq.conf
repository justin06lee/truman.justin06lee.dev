# Truman's house dns. Install to /etc/dnsmasq.conf
#
# The gateway will not hairpin for lan clients: a phone on the wifi asking for
# truman.justin06lee.dev gets the public address, sends its packets to the
# router's own wan face, and the router eats them. So the box answers dns for
# the house instead — both public names resolve straight to the box, and
# everything else forwards upstream. The gateway's dhcp hands this box out as
# the resolver, so every device on the wifi gets this for free.
domain-needed
bogus-priv
no-resolv
server=1.1.1.1
server=8.8.8.8
cache-size=1000

address=/truman.justin06lee.dev/192.168.1.253
address=/media.justin06lee.dev/192.168.1.253

# The lan address and plain loopback only. systemd-resolved keeps its stub
# listeners on 127.0.0.53/54, and bind-interfaces is what lets the two share
# port 53 on different addresses instead of fighting over the wildcard.
listen-address=127.0.0.1,192.168.1.253
bind-interfaces
