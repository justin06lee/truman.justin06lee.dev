# Truman's house dns. Install to /etc/dnsmasq.conf
#
# The gateway will not hairpin for lan clients: a phone on the wifi asking for
# truman.justin06lee.dev gets the public address, sends its packets to the
# router's own wan face, and the router eats them. So the box answers dns for
# the house instead — both public names resolve straight to the box, and
# everything else forwards upstream. The gateway's dhcp hands this box out as
# the resolver, so every device on the wifi gets this for free.
domain-needed
bogus-priv
no-resolv
server=1.1.1.1
server=8.8.8.8
cache-size=1000

# The names live in a hosts file rather than address= lines so that
# localise-queries can answer with the record matching the asking subnet:
# a lan phone gets 192.168.x, a tailnet laptop gets 100.x.
addn-hosts=/etc/truman/dns-hosts
localise-queries

# Lan, loopback, and the tailscale address. systemd-resolved keeps its stub
# listeners on 127.0.0.53/54; bind-dynamic (not bind-interfaces) picks up the
# tailscale address whenever that interface comes up after us at boot.
listen-address=127.0.0.1,192.168.1.253,100.102.72.87
bind-dynamic
